    <script>
      // Prevent TypeError when browser extensions try to set window.fetch in iframe
      try {
        let activeFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return activeFetch;
          },
          set(fn) {
            activeFetch = fn;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        // Fallback if property already defined
      }
    </script>
